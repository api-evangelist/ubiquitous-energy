aid: ubiquitous-energy
name: Ubiquitous Energy
description: >-
  Ubiquitous Energy is a Redwood City, California materials-science company and MIT spin-out that
  develops UE Power (formerly ClearView Power), a transparent photovoltaic coating applied to glass.
  The coating uses small-molecule organic semiconductor dyes to absorb ultraviolet and infrared light
  while transmitting visible light, so a window generates electricity without a visible aesthetic
  change and while retaining low-e thermal performance. The company designs, synthesizes and
  characterizes novel organic semiconductor molecules, evaluates transparent photovoltaic devices
  against industry test protocols, and sells technical consultation, R&D, design and engineering
  services to glass and glass-coating manufacturers. Its product is a physical coating and a
  licensing/engineering practice, not software; it publishes no developer program, API, SDK or
  machine-readable contract of any kind.
